{% extends "base.html" %}
{% block title %}登录 - Task Manager{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2 id="auth-title">登录</h2>

    <form id="auth-form">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <div class="form-group" id="confirm-group" style="display:none">
        <label>确认密码</label>
        <input type="password" id="confirm-password" autocomplete="new-password" />
      </div>
      <div id="auth-error" class="error-msg" style="display:none"></div>
      <button type="submit" class="btn btn-primary" id="auth-btn">登录</button>
    </form>

    <p class="auth-switch">
      <span id="switch-text">没有账号？</span>
      <a href="#" id="switch-link">注册</a>
    </p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  let mode = 'login';

  const title    = document.getElementById('auth-title');
  const btn      = document.getElementById('auth-btn');
  const errorEl  = document.getElementById('auth-error');
  const confirm  = document.getElementById('confirm-group');
  const switchTxt = document.getElementById('switch-text');
  const switchLnk = document.getElementById('switch-link');
  const form     = document.getElementById('auth-form');

  switchLnk.addEventListener('click', (e) => {
    e.preventDefault();
    mode = mode === 'login' ? 'register' : 'login';
    if (mode === 'register') {
      title.textContent = '注册';
      btn.textContent = '注册';
      confirm.style.display = 'block';
      switchTxt.textContent = '已有账号？';
      switchLnk.textContent = '登录';
    } else {
      title.textContent = '登录';
      btn.textContent = '登录';
      confirm.style.display = 'none';
      switchTxt.textContent = '没有账号？';
      switchLnk.textContent = '注册';
    }
    errorEl.style.display = 'none';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.style.display = 'none';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (mode === 'register') {
      const confirmPwd = document.getElementById('confirm-password').value;
      if (password !== confirmPwd) {
        errorEl.textContent = '两次密码不一致';
        errorEl.style.display = 'block';
        return;
      }
    }

    const endpoint = mode === 'login' ? '/api/v1/auth/login' : '/api/v1/auth/register';
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });

      if (res.status === 201) {
        // 注册成功 → 自动登录
        const loginRes = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await loginRes.json();
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('username', username);
        window.location.href = '/';
        return;
      }

      if (res.ok) {
        const data = await res.json();
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('username', username);
        window.location.href = '/';
      } else {
        const err = await res.json();
        errorEl.textContent = err.detail || '操作失败';
        errorEl.style.display = 'block';
      }
    } catch {
      errorEl.textContent = '网络错误，请检查服务是否启动';
      errorEl.style.display = 'block';
    }
  });
</script>
{% endblock %}
