{% extends "base.html" %}
{% block title %}任务管理 - Task Manager{% endblock %}

{% block content %}

<!-- 操作栏 -->
<div class="toolbar">
  <button class="btn btn-primary" id="btn-create">+ 新建任务</button>

  <div class="filters">
    <select id="filter-status">
      <option value="">全部状态</option>
      <option value="todo">待办</option>
      <option value="in_progress">进行中</option>
      <option value="done">已完成</option>
    </select>
    <select id="filter-priority">
      <option value="">全部优先级</option>
      <option value="high">高</option>
      <option value="medium">中</option>
      <option value="low">低</option>
    </select>
    <select id="filter-tag">
      <option value="">全部标签</option>
    </select>
  </div>
</div>

<!-- 任务列表 -->
<div id="task-list" class="task-list">
  <p class="loading">加载中…</p>
</div>

<!-- 弹窗：新建/编辑任务 -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">新建任务</h3>
      <button class="btn-close" id="btn-close">&times;</button>
    </div>
    <form id="task-form">
      <input type="hidden" id="task-id" />
      <div class="form-group">
        <label>标题 *</label>
        <input type="text" id="task-title" required maxlength="200" />
      </div>
      <div class="form-group">
        <label>描述</label>
        <textarea id="task-desc" rows="3"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>优先级</label>
          <select id="task-priority">
            <option value="medium">中</option>
            <option value="low">低</option>
            <option value="high">高</option>
          </select>
        </div>
        <div class="form-group">
          <label>状态</label>
          <select id="task-status">
            <option value="todo">待办</option>
            <option value="in_progress">进行中</option>
            <option value="done">已完成</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>城市（可选，自动获取天气）</label>
        <input type="text" id="task-city" placeholder="如：Beijing" />
      </div>
      <div class="form-group">
        <label>标签</label>
        <div id="tag-checkboxes"></div>
      </div>
      <div id="task-error" class="error-msg" style="display:none"></div>
      <div class="modal-footer">
        <button type="button" class="btn" id="btn-cancel">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 标签管理区 -->
<div class="tag-manager">
  <h4>标签管理</h4>
  <div class="tag-input-row">
    <input type="text" id="new-tag-name" placeholder="新标签名" maxlength="50" />
    <button class="btn btn-sm" id="btn-add-tag">添加</button>
  </div>
  <div id="tag-list" class="tag-chips"></div>
</div>

{% endblock %}

{% block scripts %}
<script>
  const API = '/api/v1';
  const token = localStorage.getItem('token');

  // ── 未登录 → 跳转 ──
  if (!token) { window.location.href = '/login'; }

  const headers = {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${token}`,
  };

  // ── 工具函数 ──
  function statusLabel(s) {
    return { todo: '待办', in_progress: '进行中', done: '已完成' }[s] || s;
  }
  function priorityLabel(p) {
    return { high: '高', medium: '中', low: '低' }[p] || p;
  }
  function statusColor(s) {
    return { todo: '#f0ad4e', in_progress: '#5bc0de', done: '#5cb85c' }[s] || '#999';
  }
  function priorityColor(p) {
    return { high: '#d9534f', medium: '#f0ad4e', low: '#5cb85c' }[p] || '#999';
  }

  // ── 加载标签 ──
  async function loadTags() {
    const res = await fetch(`${API}/tags`, { headers });
    return res.ok ? await res.json() : [];
  }

  // ── 渲染任务列表 ──
  async function renderTasks() {
    const list = document.getElementById('task-list');
    list.innerHTML = '<p class="loading">加载中…</p>';

    const params = new URLSearchParams();
    const s = document.getElementById('filter-status').value;
    const p = document.getElementById('filter-priority').value;
    const t = document.getElementById('filter-tag').value;
    if (s) params.set('status', s);
    if (p) params.set('priority', p);
    if (t) params.set('tag_id', t);

    const res = await fetch(`${API}/tasks?${params}`, { headers });
    if (!res.ok) { list.innerHTML = '<p class="error">加载失败</p>'; return; }
    const data = await res.json();

    if (data.items.length === 0) {
      list.innerHTML = '<p class="empty">暂无任务，点击「新建任务」开始</p>';
      return;
    }

    list.innerHTML = data.items.map(task => `
      <div class="task-card">
        <div class="task-header">
          <span class="task-title">${escapeHtml(task.title)}</span>
          <span class="task-status" style="background:${statusColor(task.status)}">${statusLabel(task.status)}</span>
        </div>
        ${task.description ? `<p class="task-desc">${escapeHtml(task.description)}</p>` : ''}
        <div class="task-meta">
          <span class="task-priority" style="color:${priorityColor(task.priority)}">${priorityLabel(task.priority)}</span>
          ${task.city ? `<span class="task-city">📍 ${escapeHtml(task.city)}</span>` : ''}
          ${task.tags.map(t => `<span class="tag-chip">${escapeHtml(t.name)}</span>`).join('')}
          <span class="task-time">${new Date(task.created_at).toLocaleString('zh-CN')}</span>
        </div>
        ${task.weather ? renderWeather(task.weather) : ''}
        <div class="task-actions">
          <button class="btn btn-sm" onclick="editTask(${task.id})">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="deleteTask(${task.id})">删除</button>
        </div>
      </div>
    `).join('');
  }

  function renderWeather(w) {
    try {
      const d = typeof w.weather_json === 'string' ? JSON.parse(w.weather_json) : w.weather_json;
      if (d.status) return '';
      return `<div class="task-weather">
        🌡 ${d.temperature}°C  💨 ${d.wind_speed}km/h  🌤 ${weatherCodeText(d.weather_code)}
      </div>`;
    } catch { return ''; }
  }
  function weatherCodeText(code) {
    const map = { 0:'晴',1:'少云',2:'多云',3:'阴',45:'雾',51:'小雨',61:'中雨',71:'小雪',80:'阵雨',95:'雷暴' };
    return map[code] || '未知';
  }
  function escapeHtml(s) {
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }

  // ── 筛选器 ──
  document.getElementById('filter-status').addEventListener('change', renderTasks);
  document.getElementById('filter-priority').addEventListener('change', renderTasks);
  document.getElementById('filter-tag').addEventListener('change', renderTasks);
  async function loadFilterTags() {
    const tags = await loadTags();
    const sel = document.getElementById('filter-tag');
    tags.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = t.name; sel.appendChild(o); });
  }

  // ── 弹窗 ──
  const overlay = document.getElementById('modal-overlay');
  function openModal(title) {
    document.getElementById('modal-title').textContent = title;
    overlay.style.display = 'flex';
  }
  function closeModal() {
    overlay.style.display = 'none';
    document.getElementById('task-form').reset();
    document.getElementById('task-id').value = '';
    document.getElementById('task-error').style.display = 'none';
  }
  document.getElementById('btn-create').addEventListener('click', () => openModal('新建任务'));
  document.getElementById('btn-close').addEventListener('click', closeModal);
  document.getElementById('btn-cancel').addEventListener('click', closeModal);

  // ── 弹窗中的标签复选框 ──
  async function renderTagCheckboxes(selectedIds = []) {
    const tags = await loadTags();
    const container = document.getElementById('tag-checkboxes');
    container.innerHTML = tags.map(t => `
      <label class="checkbox-label">
        <input type="checkbox" value="${t.id}" ${selectedIds.includes(t.id) ? 'checked' : ''} /> ${escapeHtml(t.name)}
      </label>
    `).join('');
  }

  // ── 新建/编辑提交 ──
  document.getElementById('task-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('task-error');
    err.style.display = 'none';

    const id = document.getElementById('task-id').value;
    const checked = [...document.querySelectorAll('#tag-checkboxes input:checked')].map(c => parseInt(c.value));

    const body = {
      title: document.getElementById('task-title').value.trim(),
      description: document.getElementById('task-desc').value.trim() || null,
      priority: document.getElementById('task-priority').value,
      status: document.getElementById('task-status').value,
      city: document.getElementById('task-city').value.trim() || null,
      tag_ids: checked,
    };

    const method = id ? 'PUT' : 'POST';
    const url = id ? `${API}/tasks/${id}` : `${API}/tasks`;

    try {
      const res = await fetch(url, { method, headers, body: JSON.stringify(body) });
      if (res.ok) {
        closeModal();
        renderTasks();
      } else {
        const d = await res.json();
        err.textContent = d.detail || '操作失败';
        err.style.display = 'block';
      }
    } catch {
      err.textContent = '网络错误';
      err.style.display = 'block';
    }
  });

  // ── 编辑 ──
  async function editTask(id) {
    const res = await fetch(`${API}/tasks/${id}`, { headers });
    if (!res.ok) return alert('获取任务详情失败');
    const task = await res.json();

    document.getElementById('task-id').value = task.id;
    document.getElementById('task-title').value = task.title;
    document.getElementById('task-desc').value = task.description || '';
    document.getElementById('task-priority').value = task.priority;
    document.getElementById('task-status').value = task.status;
    document.getElementById('task-city').value = task.city || '';
    await renderTagCheckboxes(task.tags.map(t => t.id));
    openModal('编辑任务');
  }

  // ── 删除 ──
  async function deleteTask(id) {
    if (!confirm('确定删除该任务？')) return;
    await fetch(`${API}/tasks/${id}`, { method: 'DELETE', headers });
    renderTasks();
  }

  // ── 标签管理 ──
  async function renderTagList() {
    const tags = await loadTags();
    const container = document.getElementById('tag-list');
    container.innerHTML = tags.map(t => `
      <span class="tag-chip">
        ${escapeHtml(t.name)}
        <a href="#" class="tag-delete" data-id="${t.id}">&times;</a>
      </span>
    `).join('');

    container.querySelectorAll('.tag-delete').forEach(a => {
      a.addEventListener('click', async (e) => {
        e.preventDefault();
        const tid = parseInt(a.dataset.id);
        await fetch(`${API}/tags/${tid}`, { method: 'DELETE', headers });
        renderTagList();
        renderTagCheckboxes();
        loadFilterTags();
        renderTasks();
      });
    });
  }

  document.getElementById('btn-add-tag').addEventListener('click', async () => {
    const input = document.getElementById('new-tag-name');
    const name = input.value.trim();
    if (!name) return;
    await fetch(`${API}/tags`, { method: 'POST', headers, body: JSON.stringify({ name }) });
    input.value = '';
    renderTagList();
    renderTagCheckboxes();
    loadFilterTags();
  });

  // ── 页面初始化 ──
  loadFilterTags();
  renderTasks();
  renderTagCheckboxes();
  renderTagList();
</script>
{% endblock %}
